name: probe-iv

# One-off manual probe. NO cron — this must never run on a schedule.
# It exists to answer one question: does Yahoo serve usable option chains for
# the Hartnett flow-category proxies, and which ones clear the liquidity gate.
#
# SAFETY: probe_iv.py itself writes nothing. This workflow redirects its stdout
# into data/_probe_iv.json — a NEW file. It never touches weekly_closes.csv,
# hull_weekly.csv, vol_indices.csv, hull3d.csv, _status.json or board.json,
# so it cannot damage the weekly pipeline no matter how it fails.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many tickers to probe (leave blank = all). Use 8 for a smoke test."
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.60" pandas numpy

      - name: Run probe
        id: probe
        run: |
          set +e
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python probe_iv.py --json --limit ${{ github.event.inputs.limit }} > data/_probe_iv.json
          else
            python probe_iv.py --json > data/_probe_iv.json
          fi
          CODE=$?
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT
          echo "---- first 40 lines of result ----"
          head -40 data/_probe_iv.json || true
          exit 0

      - name: Commit result
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add data/_probe_iv.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "probe-iv: option chain probe result"
            git pull --rebase --autostash || true
            git push
          fi

      # Fail LOUDLY if the probe errored, but only after the result is safely
      # committed. A red run with data beats a green run with nothing — the
      # whole point is to see what came back, including the failures.
      - name: Surface probe exit code
        if: steps.probe.outputs.exit_code != '0'
        run: |
          echo "probe_iv.py exited ${{ steps.probe.outputs.exit_code }}"
          exit 1
