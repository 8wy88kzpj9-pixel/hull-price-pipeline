<!--
  STANDALONE BUILD — served from GitHub Pages. Fixed URL, updated by commit.

  WHY THIS FILE EXISTS
  A published Claude artifact serves the card it was published FROM. Each
  rewrite created a new card, so the shared link kept serving v2.7.0 while the
  chat showed the current build. Re-publishing could not fix it. Here the URL
  is fixed and the content is whatever is committed — the same property that
  made board.json trustworthy once we stopped reading it through a CDN cache.

  FIX LOG
  v1 of this wrapper used <script type="text/babel" data-type="module">. That
  told Babel to emit ESM, so preset-react used the AUTOMATIC jsx runtime and
  produced `import ... from "react/jsx-runtime"` — a bare specifier no browser
  can resolve without a bundler. It failed with:
      TypeError: Module name, 'react/jsx-runtime' does not resolve to a valid URL
  v2 stops guessing at Babel's defaults. The JSX is parked in a text/plain
  block the browser will not execute, then transformed explicitly with
  {runtime: "classic"} so the output is React.createElement calls against the
  UMD global. Pinning behaviour beats relying on a default that changed
  between Babel 7 and 8.

  DEPLOY
    commit as  tracker.html  at the repo ROOT (same level as the data/ folder —
    data/board.json already proves Pages serves from there), then open
    https://8wy88kzpj9-pixel.github.io/hull-price-pipeline/tracker.html
    First visit after a change may need ?v=2 to defeat the CDN 404/HTML cache.
-->

async function saveHistory(history, dataVersion) {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify({ v: SEED_VERSION, dataVersion: dataVersion || "seed", history }), true);
  } catch (e) { console.error("save error", e); }
}
async function loadHistory() {
  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    if (!r) return null;
    const parsed = JSON.parse(r.value);
    if (!parsed || parsed.v !== SEED_VERSION) return null; // structure changed → fresh seed
    if (!Array.isArray(parsed.history)) return null;
    return { history: parsed.history, dataVersion: parsed.dataVersion || "seed" };
  } catch { return null; }
}
async function clearHistory() {
  try { await window.storage.delete(STORAGE_KEY, true); } catch (e) { console.error("clear error", e); }
}

function computeIV(assetId, week) {
  const d = getIVData(assetId);
  const { bb } = week;
  if (!hasVal(d.iv)) {
    return {
      fairIV: null, impliedIV: null, ivRegime: "NO DATA", putVerdict: "HOLD OFF", ivRatio: null,
      dte: "—", strike: "—", structure: "—", ivPct52wk: null, pctEst: false,
      ivAsOf: IV_ASOF, ivStale: !!d.stale, src: d.src,
      putBuy: d.putBuy, putThresh: d.putThresh, ivLo: d.ivLo, ivHi: d.ivHi,
    };
  }
  const impliedIV  = d.iv;
  const fairIV     = +((d.ivLo + d.ivHi) / 2).toFixed(1);
  const ivRatio    = +(impliedIV / fairIV).toFixed(2);
  // ⚠️ FIXED 2026-08-16 (2nd pass). ivPct52wk used to be derived ENTIRELY from
  // ivLo/ivHi — two hand-set design bands — while being labelled "%ile/52wk" in
  // the UI. That is a false label, not a rounding difference: measured against
  // board.json 8/14 it was off by 5-8 points on every live series
  //     VIX  band-derived 3.7%  vs real 2.8%
  //     VXN  band-derived 21.6% vs real 29.4%
  //     GVZ  band-derived 28.8% vs real 34.9%
  // and the UI colours the tile green at <=30 / red at >=75, so an 8-point
  // error can flip the colour. board.json already ships pct_52w computed from
  // 252 trading days; use it when present. Band-derived is kept ONLY as a
  // fallback and is flagged pctEst so the display can say so.
  const pctReal    = hasVal(d.pct);
  const ivPct52wk  = pctReal ? +Number(d.pct).toFixed(0)
    : +Math.min(100, Math.max(0,
        ((impliedIV - d.ivLo) / (d.ivHi - d.ivLo)) * 100
      )).toFixed(0);

  let ivRegime;
  if      (impliedIV <= d.putBuy)                     ivRegime = "CHEAP";
  else if (impliedIV >= d.putThresh)                  ivRegime = "EXPENSIVE";
  else if (impliedIV >= d.putThresh * 0.88)           ivRegime = "ELEVATED";
  else if (impliedIV <= d.putBuy * 1.25)              ivRegime = "SUPPRESSED";
  else                                                ivRegime = "FAIR";

  let putVerdict = "HOLD OFF";
  const flowSignal = computeSignal(assetId, week);

  if (["AVOID / PUT", "REDUCE"].includes(flowSignal)) {
    if      (ivRegime === "CHEAP" || ivRegime === "SUPPRESSED") putVerdict = "BUY PUT ★";
    else if (ivRegime === "FAIR")                               putVerdict = "BUY PUT";
    else if (ivRegime === "ELEVATED")                           putVerdict = "SPREAD";
    else                                                        putVerdict = "WAIT IV";
  } else if (flowSignal === "WATCH" && (ivRegime === "CHEAP" || ivRegime === "SUPPRESSED")) {
    putVerdict = "PREP";
  }

  const stale = !!d.stale;
  if (stale) putVerdict = "HOLD OFF";

  const dte = (ivRegime === "CHEAP" || ivRegime === "SUPPRESSED") ? "90-120 DTE"
            : ivRegime === "FAIR"                                  ? "60-90 DTE"
            : ivRegime === "ELEVATED"                              ? "45 DTE / spread"
            : "Bear spread only";

  const strike = bb >= 8.5 ? "OTM 5-10%"
               : bb >= 8.0 ? "OTM 5-7%"
               : bb >= 7.0 ? "OTM 3-5%"
               : "ATM-OTM 2%";

  const structure = (ivRegime === "EXPENSIVE" || ivRegime === "ELEVATED")
    ? "Bear Put Spread" : "Outright Put";

  return {
    fairIV, impliedIV, ivRegime, putVerdict, ivRatio, stale,
    dte, strike, structure, ivPct52wk, pctEst: !pctReal, ivAsOf: IV_ASOF, ivStale: !!d.stale,
    src: d.src,
    putBuy: d.putBuy, putThresh: d.putThresh, ivLo: d.ivLo, ivHi: d.ivHi,
  };
}

//
// Legs are INDEPENDENT — leg 2 does not require leg 1. Exits are evaluated
// before entries, so a leg that meets both conditions reads OUT.
// Tri-state on purpose: "in" | "out" | null. null means an input was not
// sourced and is NEVER shown as "out" — the whole point of this session.
const LADDER_TAG = "v2.2";
const flowWindow = (assetId) => (assetId === "crypto" ? 2 : 3);

function computeLadder(assetId, hist) {
  const n = hist.length;
  if (!n) return { legs: [null, null, null], win: 3, flows: [], exitAll: false };
  const w = hist[n - 1];
  const win = flowWindow(assetId);

  const flows = [];
  for (let i = n - win; i < n; i++) flows.push(i >= 0 ? (hist[i].flows?.[assetId] ?? null) : null);
  const known = flows.length === win && flows.every((v) => hasVal(v));
  const inAll = known && flows.every((v) => v > 0);
  const outAll = known && flows.every((v) => v < 0);

  const h3 = w.hull3dSignals ? (w.hull3dSignals[assetId] ?? null) : null;
  const hw = w.hullSignals?.[assetId] ?? null;

  // exit first, always. Weekly red is NOT an exit (see v2.1 in the trail above).
  const leg1 = h3 === null ? null
    : (h3 === "red" || outAll) ? "out"
    : (h3 === "green" ? "in" : "out");
  const leg2 = !known ? null : outAll ? "out" : (inAll ? "in" : "out");
  const leg3 = hw === null ? null : outAll ? "out" : (hw === "green" ? "in" : "out");

  return { legs: [leg1, leg2, leg3], win, flows, exitAll: outAll };
}

}

function computeSignal(assetId, w) {
  const { flows, hullSignals, bb, pcRatio, emOutflow4wk } = w;
  if (flows[assetId] === null || flows[assetId] === undefined) return "NO DATA";
  const flow = flows[assetId];
  const hull = hullSignals[assetId] ?? null; // v2.2: null = NO READ, matches no rule branch

  const pcLow = hasVal(pcRatio) && pcRatio < 0.5;
  const emHi = hasVal(emOutflow4wk) && emOutflow4wk >= 3.0; // v2.3: aligned to documented EM Flow Trading Rule (buy when 4wk outflow >= 3% AUM)

  if (["hk", "em", "thailand", "em_total"].includes(assetId)) {
    if (emRuleActive(w.date)) {
      // Rule is live. If BofA has not printed the number, say so — do NOT let
      // an unevaluable rule masquerade as a market verdict.
      if (!hasVal(emOutflow4wk)) return "NO RULE DATA";
      if (hull === "green" && emHi) return "BUY";
      if (flow < 0 && emHi) return "WATCH";
      return "WAIT";
    }
    // Rule expired -> same treatment as the other EM legs, nothing special.
    if (hull === "red") return "WAIT";
    if (hull === "green" && flow > 0) return "BUY";
    if (hull === "green") return "WATCH";
    return "WAIT";
  }
  if (["em_brazil", "em_india", "em_china"].includes(assetId)) {
    if (hull === "red") return "WAIT";
    if (hull === "green" && flow > 0) return "BUY";
    if (hull === "green") return "WATCH";
    return "WAIT";
  }
  if (["sox", "ustech", "sec_tech"].includes(assetId)) {
    if (bbHi && flow > 5 && pcLow) return "AVOID / PUT";
    if (bbHi && flow > 3) return "REDUCE";
    if (bbHi) return "REDUCE";
    if (hull === "green" && flow > 0) return "HOLD";

  if (["gold", "precious_metals"].includes(assetId)) {

  if (assetId === "crypto") {

  if (assetId === "china_stocks") {
    if (hull === "red") return "WAIT";
    if (hull === "green" && flow > 0) return "WATCH";
    return "WAIT";
  }
  if (assetId === "us_largecap") {
    if (bbHi && flow > 10) return "REDUCE";            // euphoric chase
    if (bbXHi && flow < -5) return "REDUCE";           // v2.3: extreme sell-zone + heavy outflow — coherent with global_stocks
    if (hull === "green") return "HOLD";
    return "NEUTRAL";

  if (assetId === "us_growth") {
    if (bbHi) return "REDUCE";

    return "NEUTRAL";

  if (assetId === "us_value") {
    if (hull === "green" && flow > 0) return "HOLD";
    return "NEUTRAL";
  }
  if (assetId === "us_smallcap") {
    if (flow < -2) return "WAIT";
    if (hull === "green" && flow > 0) return "WATCH";
    return "NEUTRAL";
  }
  if (["sec_consumer", "sec_utilities", "sec_realestate"].includes(assetId)) {
    if (bbXHi && hull === "green" && flow > 0) return "WATCH"; // v2.3: defensive-rotation idea kept, BUY demoted — no outright BUY under a live B&B sell signal
    if (bbXHi && flow < 0) return "WATCH";
    if (flow < -0.5 && hull === "red") return "WAIT";

// because the gate was written as "is emOutflow4wk >= 3.0", and emOutflow4wk
// has been null since wk16. A null made emHi false, which silently sent em /

// market said wait, but because the rule could not evaluate. Five editions of
// "WAIT" that meant "no input".
//
// BofA states a signal LIFE for every Rules & Tools line. This one is 8 weeks
// from the 2026-07-23 reading, so it dies on its own. Encode that: after the
// expiry the rule is simply gone and the asset falls through to the ordinary
// hull+flow logic. A rule with a stated life that never expires is not the
// rule BofA published.
const EM_RULE = {
  read: 2.2,                  // % AUM, 4wk INflow as printed
  signal: "Sell",
  firedAsOf: "2026-07-23",    // the reading's own date, not the splice date
  lifeWeeks: 8,               // per the published Rules & Tools line
  expires: "2026-09-17",      // firedAsOf + 8 weeks
};
const emRuleActive = (weekDate) =>
  !!weekDate && weekDate >= EM_RULE.firedAsOf && weekDate < EM_RULE.expires;
const emRuleWeek = (weekDate) => {
  if (!weekDate) return null;
  const d = Math.round((Date.parse(weekDate) - Date.parse(EM_RULE.firedAsOf)) / 604800000);
  return Math.min(EM_RULE.lifeWeeks, Math.max(1, d + 1));
};

// Walk BACK from the selected week. On the latest week this gives the newest
// call, which is what was asked for; on an older week it gives what was true
// then, so browsing history never shows a future opinion as if it were current.
function hartnettCall(assetId, weekDate) {
  const dates = Object.keys(HARTNETT_CALLS).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    const d = dates[i];
    if (weekDate && d > weekDate) continue;
    const ed = HARTNETT_CALLS[d];
    if (ed.calls[assetId]) {
      const wks = weekDate ? Math.round((Date.parse(weekDate) - Date.parse(d)) / 604800000) : 0;
      return { ...ed.calls[assetId], from: d, edition: ed.edition, carriedWeeks: wks };
    }
  }
  if (weekDate && weekDate < dates[0]) return { side: "NOT SOURCED", from: null, carriedWeeks: 0 };
  return { side: "NOT NAMED", from: null, carriedWeeks: 0 };
}

// FOUR STATES, not two. The first cut of this table only had "call" and "not
// named", which forced two different mistakes at once: China read as NOT NAMED
// even though he devotes half the edition to calling the end of the China bear,
// and semis read as NOT NAMED even though he names them as the vulnerable side.
// Neither is a position he states, so neither can be LONG or SHORT — but
// flattening them to "not named" throws away a real directional view.
//   LONG / SHORT  he names a POSITION in the first person

const HULL_COLOR = { green: "#1FB94C", yellow: "#CA8A04", red: "#F43F5E" };

// ═══════════════════════════════════════════════════════════════════════════
// WEEK PATCH VALIDATION — Update Protocol v4, Part E.2
// Sanity gates run IN SOFTWARE, not by eye. Errors block commit; warnings need
// explicit confirmation. Missing key = null, never 0.
// ═══════════════════════════════════════════════════════════════════════════
const MACRO_KEYS = ["bb", "pcRatio", "skew", "vix", "emOutflow4wk", "cashLevel"];
const HULL_VALUES = new Set(["red", "yellow", "green"]);

function validateWeekPatch(raw, history) {
  const errors = [];
  const warnings = [];

  if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
    return { errors: ["Patch must be a JSON object."], warnings, week: null, dataVersion: null };
  }
  const wk = raw.week;
  if (!wk || typeof wk !== "object" || Array.isArray(wk)) {
    return { errors: ["Missing \"week\" object."], warnings, week: null, dataVersion: null };
  }

  // ── date: ISO, strictly after last stored week (append-only, Protocol A.7) ──
  if (typeof wk.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(wk.date)) {
    errors.push("week.date must be ISO YYYY-MM-DD.");
  } else if (history && history.length > 0) {
    const last = history[history.length - 1].date;
    if (wk.date <= last) errors.push(`week.date ${wk.date} must be AFTER last stored week ${last} (append-only; no retro-edit).`);
  }

  // ── macro gates (Protocol B.1 / B.2 / B.3) ──
  const num = (k) => {
    const v = wk[k];
    if (v === undefined || v === null) return null;
    if (typeof v !== "number" || !isFinite(v)) { errors.push(`${k} must be a number or null.`); return null; }
    return v;
  };
  const bb = num("bb"), pcRatio = num("pcRatio"), skew = num("skew"), vix = num("vix");
  const emOut = num("emOutflow4wk"), cash = num("cashLevel");

  if (pcRatio !== null && pcRatio >= 0.85)
    errors.push(`pcRatio ${pcRatio} ≥ 0.85 ⇒ TOTAL P/C series (B.1 trap, cf. wk11 0.99-total vs 0.67-equity). Re-pull the EQUITY series (MacroMicro 1640 / ycharts cboe_equity_put_call_ratio).`);
  if (pcRatio !== null && pcRatio < 0.2)
    warnings.push(`pcRatio ${pcRatio} below the historical equity band (0.40–0.67) — verify series.`);
  if (skew !== null && (skew < 100 || skew > 190))
    errors.push(`skew ${skew} outside 100–190 — not a plausible ^SKEW close.`);
  if (vix !== null && (vix < 5 || vix > 100))
    errors.push(`vix ${vix} outside 5–100 — not a plausible ^VIX close.`);
  if (bb !== null && (bb < 0 || bb > 10))
    errors.push(`bb ${bb} outside 0–10 — B&B is a 0–10 indicator.`);
  if (cash !== null && (cash < 1 || cash > 8))
    warnings.push(`cashLevel ${cash}% unusual for FMS cash (typical 3.5–6.2) — verify it is FMS, not GWIM private-client cash.`);
  MACRO_KEYS.forEach(k => { if (wk[k] === undefined) warnings.push(`${k} missing → stored as null (Protocol: null over estimate). Confirm it is genuinely unsourced (nullLog).`); });

  // ── flows: known ids, unit sanity ──
  const flows = {};
  if (wk.flows && typeof wk.flows === "object" && !Array.isArray(wk.flows)) {
    Object.entries(wk.flows).forEach(([id, v]) => {
      if (!KNOWN_FLOW_IDS.has(id)) { warnings.push(`flows.${id}: unknown asset id — ignored.`); return; }
      if (v === null) { flows[id] = null; return; }
      if (typeof v !== "number" || !isFinite(v)) { errors.push(`flows.${id} must be a number or null.`); return; }
      if (PCT_AUM_ASSETS.has(id) && Math.abs(v) > 15)
        warnings.push(`flows.${id} = ${v} — |v|>15 on a %AUM field: likely a $bn figure pasted into a %AUM asset.`);
      if (!PCT_AUM_ASSETS.has(id) && Math.abs(v) > 150)
        warnings.push(`flows.${id} = ${v} — |v|>150 $bn: likely a unit error ($mn vs $bn?).`);
      flows[id] = v;
    });
  } else if (wk.flows !== undefined) {
    errors.push("week.flows must be an object.");
  }

  // ── hullSignals: enum-checked ──
  const hullSignals = {};
  if (wk.hullSignals && typeof wk.hullSignals === "object" && !Array.isArray(wk.hullSignals)) {
    Object.entries(wk.hullSignals).forEach(([id, v]) => {
      if (!KNOWN_FLOW_IDS.has(id)) { warnings.push(`hullSignals.${id}: unknown asset id — ignored.`); return; }
      if (!HULL_VALUES.has(v)) { errors.push(`hullSignals.${id} = "${v}" — must be red | yellow | green.`); return; }
      hullSignals[id] = v;
    });
  } else if (wk.hullSignals !== undefined) {
    errors.push("week.hullSignals must be an object.");
  }
  if (Object.keys(hullSignals).length === 0)
    warnings.push("No hullSignals in patch — all assets default to red until you set your manual Hull read.");

  // ── normalize: missing = null, never 0 ──
  const week = {
    date: wk.date,
    bb, pcRatio, skew, vix, emOutflow4wk: emOut, cashLevel: cash,
    flows, hullSignals,
    title: typeof raw.reportTitle === "string" ? raw.reportTitle : (typeof wk.title === "string" ? wk.title : ""),
    estFlags: (raw.estFlags && typeof raw.estFlags === "object") ? raw.estFlags : {},
    srcNotes: (raw.srcNotes && typeof raw.srcNotes === "object") ? raw.srcNotes : {},
  };
  const dataVersion = typeof raw.patchVersion === "string" && raw.patchVersion ? raw.patchVersion : `wk-${wk.date}`;
  const nNull = MACRO_KEYS.filter(k => week[k] === null).length;
  const nFlows = Object.values(flows).filter(v => v !== null).length;

  return { errors, warnings, week, dataVersion, summary: { nFlows, nHull: Object.keys(hullSignals).length, nNullMacro: nNull } };
}

function IVGauge({ impliedIV, fairIV, putBuy, putThresh, ivLo, ivHi }) {
  const lo  = ivLo  || putBuy  * 0.7;
  const hi  = ivHi  || putThresh * 1.2;
  const axMin = Math.min(lo * 0.85, putBuy  * 0.8);
  const axMax = Math.max(hi * 1.05, putThresh * 1.1);
  const span  = axMax - axMin || 1;
  const pct = v => Math.min(99, Math.max(1, ((v - axMin) / span) * 100));

  const ivColor = impliedIV <= putBuy    ? "#1FB94C"
                : impliedIV >= putThresh ? "#F43F5E"
                : impliedIV >= putThresh * 0.88 ? "#CA8A04"
                : "#57534E";

  return (
    <div style={{ marginTop: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <span style={{ fontSize: 7, color: "#8A7E68", letterSpacing: ".1em", fontFamily: "'IBM Plex Mono',monospace" }}>
          IV GAUGE
          {ivLo && ivHi && <span style={{ color: "#B3A78F", marginLeft: 4 }}>52wk {ivLo}–{ivHi}%</span>}
        </span>
        <span style={{ fontSize: 9, color: ivColor, fontFamily: "'IBM Plex Mono',monospace", fontWeight: 700 }}>
          {impliedIV.toFixed(1)}%
        </span>
      </div>
      <div style={{ position: "relative", height: 8, background: "#E2D3B8", borderRadius: 4, overflow: "visible" }}>
        <div style={{ position: "absolute", left: 0, width: `${pct(putBuy)}%`, height: "100%", background: "rgba(31,185,76,.18)", borderRadius: "4px 0 0 4px" }} />
        <div style={{ position: "absolute", left: `${pct(putThresh)}%`, right: 0, height: "100%", background: "rgba(244,63,94,.18)", borderRadius: "0 4px 4px 0" }} />
        {ivLo && <div style={{ position: "absolute", left: `${pct(ivLo)}%`, top: -2, width: 1, height: 5, background: "#B3A78F" }} />}
        {ivHi && <div style={{ position: "absolute", left: `${pct(ivHi)}%`, top: -2, width: 1, height: 5, background: "#B3A78F" }} />}
        <div style={{ position: "absolute", left: `${pct(fairIV)}%`, top: -3, width: 1, height: 14, background: "#8A7E68", opacity: 0.8 }} />
        <div style={{
          position: "absolute", left: `${pct(impliedIV)}%`, top: "50%",
          transform: "translate(-50%,-50%)",
          width: 11, height: 11, borderRadius: "50%",
          background: ivColor, boxShadow: `0 0 7px ${ivColor}88`,
          border: "1.5px solid #FFFBF2", zIndex: 2,
        }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 3 }}>
        <span style={{ fontSize: 7, color: "#1FB94C", fontFamily: "'IBM Plex Mono',monospace" }}>CHEAP&lt;{putBuy}</span>
        <span style={{ fontSize: 7, color: "#8A7E68", fontFamily: "'IBM Plex Mono',monospace" }}>FAIR≈{fairIV.toFixed(0)}</span>
        <span style={{ fontSize: 7, color: "#F43F5E", fontFamily: "'IBM Plex Mono',monospace" }}>EXP&gt;{putThresh}</span>
      </div>
    </div>
  );
}

function MiniBarChart({ history, assetId }) {
  const vals = history.map(w => (w.flows[assetId] === undefined ? null : w.flows[assetId]));
  const absMax = Math.max(...vals.filter(v => v !== null).map(Math.abs), 0.1);
  const chartH = 40; const barW = 9; const gap = 3;
  const totalW = vals.length * (barW + gap) - gap;
  const isPct = PCT_AUM_ASSETS.has(assetId);
  return (
    <div style={{ marginTop: 8 }}>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>
        <span style={{ fontSize: 7, color: "#8A7E68", letterSpacing: ".1em", fontFamily: "'IBM Plex Mono',monospace" }}>
          {history.length}-WK FLOW ({flowUnit(assetId)})
        </span>
        {isPct && <span style={{ fontSize: 6, color: "#8A7E6866", fontFamily: "'IBM Plex Mono',monospace" }}>*wk1-3 est | hk,th all est</span>}
      </div>
      <svg width={totalW} height={chartH + 12} style={{ overflow: "visible" }}>
        <line x1={0} y1={chartH / 2} x2={totalW} y2={chartH / 2} stroke="#E2D3B8" strokeWidth={1} />
        {vals.map((v, i) => {
          const isLast = i === vals.length - 1;
          if (v === null) return (
            <rect key={i} x={i * (barW + gap)} y={chartH / 2 - 4} width={barW} height={8}
              fill="none" stroke="#B3A78F" strokeWidth={1} strokeDasharray="2,2" rx={1} />
          );
          const ratio = Math.abs(v) / absMax;
          const barH = Math.max(2, ratio * (chartH / 2 - 2));
          const x = i * (barW + gap);
          const isPos = v >= 0;
          const color = isLast ? (isPos ? "#1FB94C" : "#F43F5E") : (isPos ? "#1FB94C44" : "#F43F5E44");
          const y = isPos ? chartH / 2 - barH : chartH / 2;
          return (
            <g key={i}>
              <rect x={x} y={y} width={barW} height={barH} fill={color} rx={1} />
              {isLast && (
                <text x={x + barW / 2} y={isPos ? y - 2 : y + barH + 8} textAnchor="middle" fontSize={7}
                  fill={isPos ? "#1FB94C" : "#F43F5E"} fontFamily="'IBM Plex Mono',monospace">
                  {v >= 0 ? "+" : ""}{v.toFixed(1)}
                </text>
              )}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function SignalTrail({ history, assetId }) {
  const signals = history.map(w => computeSignal(assetId, w));
  return (
    <div style={{ display: "flex", gap: 2, marginTop: 6, alignItems: "center" }}>

      {signals.map((s, i) => {
        const m = SIG[s] || SIG.NEUTRAL;
        const isLast = i === signals.length - 1;
        return (
          <div key={i} title={`${history[i].date}: ${s}`} style={{
            width: isLast ? 10 : 7, height: isLast ? 10 : 7, borderRadius: 2,
            background: m.color, opacity: isLast ? 1 : 0.35 + (i / signals.length) * 0.5, flexShrink: 0,
          }} />
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// IMPORT WEEK PANEL (Protocol v4, Part E.2/E.3)
// Paste WEEK PATCH JSON → validate → review diff → commit (append + auto-save).
// ═══════════════════════════════════════════════════════════════════════════
function ImportWeekPanel({ history, onCommit }) {
  const [open, setOpen] = useState(false);
  const [text, setText] = useState("");
  const [result, setResult] = useState(null); // {errors, warnings, week, dataVersion, summary} | {parseError}
  const [committing, setCommitting] = useState(false);

  const mono = { fontFamily: "'IBM Plex Mono',monospace" };

  const runValidate = () => {
    let raw;
    try { raw = JSON.parse(text); }
    catch (e) { setResult({ parseError: "JSON parse failed: " + e.message }); return; }
    setResult(validateWeekPatch(raw, history));
  };

  const commit = async () => {
    if (!result || !result.week || result.errors.length > 0 || committing) return;
    setCommitting(true);
    await onCommit(result.week, result.dataVersion);
    setCommitting(false);
    setText(""); setResult(null); setOpen(false);
  };

  const canCommit = result && result.week && result.errors && result.errors.length === 0;

  return (
    <div style={{ background: "#F6EBD9", border: "1px solid #1FB94C40", borderRadius: 6, marginBottom: 16, overflow: "hidden" }}>
      <button onClick={() => setOpen(!open)} style={{
        width: "100%", padding: "10px 14px", background: "none", border: "none", cursor: "pointer",
        display: "flex", justifyContent: "space-between", alignItems: "center", ...mono,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 9, color: "#1FB94C", letterSpacing: ".15em", fontWeight: 700 }}>⇪ IMPORT WEEK</span>
          <span style={{ fontSize: 8, color: "#6E6657" }}>paste WEEK PATCH JSON — no code regen (Protocol v4 · Part E)</span>
        </div>
        <span style={{ fontSize: 7, color: "#8A7E68" }}>{open ? "▲" : "▼"}</span>
      </button>

      {open && (
        <div style={{ padding: "0 14px 16px", borderTop: "1px solid #E2D3B8" }}>
          <div style={{ fontSize: 7, color: "#8A7E68", marginTop: 11, marginBottom: 6, lineHeight: 1.6 }}>
            Expected shape: {"{ patchVersion, reportTitle, week: { date, bb, pcRatio, skew, vix, emOutflow4wk, cashLevel, flows{}, hullSignals{} }, estFlags{}, srcNotes{}, nullLog[] }"} · missing key = null, never 0 · date must be after {history[history.length - 1].date}
          </div>
          <textarea value={text} onChange={e => { setText(e.target.value); setResult(null); }}
            placeholder='{"patchVersion":"wk12-2026-07-03","reportTitle":"…","week":{"date":"2026-07-03", …}}'
            spellCheck={false}
            style={{
              width: "100%", minHeight: 130, boxSizing: "border-box", resize: "vertical",
              background: "#FFFBF2", border: "1px solid #E2D3B8", borderRadius: 4,
              padding: "8px 10px", color: "#1A1A1A", ...mono, fontSize: 10, outline: "none", lineHeight: 1.5,
            }} />
          <div style={{ display: "flex", gap: 8, marginTop: 8, alignItems: "center" }}>
            <button onClick={runValidate} disabled={!text.trim()} style={{
              padding: "5px 14px", borderRadius: 3, cursor: text.trim() ? "pointer" : "default", ...mono, fontSize: 10, fontWeight: 700,
              background: "transparent", border: "1px solid #111111", color: text.trim() ? "#111111" : "#B3A78F", opacity: text.trim() ? 1 : 0.5,
            }}>1 · VALIDATE</button>
            <button onClick={commit} disabled={!canCommit} style={{
              padding: "5px 14px", borderRadius: 3, cursor: canCommit ? "pointer" : "default", ...mono, fontSize: 10, fontWeight: 700,
              background: canCommit ? "#1FB94C20" : "transparent",
              border: `1px solid ${canCommit ? "#1FB94C" : "#E2D3B8"}`,
              color: canCommit ? "#1FB94C" : "#B3A78F",
            }}>{committing ? "COMMITTING…" : "2 · COMMIT & SAVE"}</button>
            {result && result.warnings && result.warnings.length > 0 && canCommit && (
              <span style={{ fontSize: 8, color: "#CA8A04" }}>⚠ {result.warnings.length} warning(s) — review below, commit is allowed</span>
            )}
          </div>

          {result && result.parseError && (
            <div style={{ marginTop: 10, padding: "8px 11px", background: "rgba(244,63,94,.08)", border: "1px solid #F43F5E40", borderRadius: 4, fontSize: 9, color: "#F43F5E", ...mono }}>
              ✕ {result.parseError}
            </div>
          )}

          {result && result.errors && result.errors.length > 0 && (
            <div style={{ marginTop: 10, padding: "8px 11px", background: "rgba(244,63,94,.08)", border: "1px solid #F43F5E40", borderRadius: 4 }}>
              <div style={{ fontSize: 8, color: "#F43F5E", fontWeight: 700, letterSpacing: ".1em", marginBottom: 5 }}>✕ REJECTED — {result.errors.length} ERROR(S), COMMIT BLOCKED</div>
              {result.errors.map((e, i) => (
                <div key={i} style={{ fontSize: 8, color: "#B91C3C", lineHeight: 1.6 }}>· {e}</div>
              ))}
            </div>
          )}

          {result && result.warnings && result.warnings.length > 0 && (
            <div style={{ marginTop: 8, padding: "8px 11px", background: "rgba(202,138,4,.08)", border: "1px solid #CA8A0440", borderRadius: 4 }}>
              <div style={{ fontSize: 8, color: "#CA8A04", fontWeight: 700, letterSpacing: ".1em", marginBottom: 5 }}>⚠ WARNINGS — review before commit</div>
              {result.warnings.map((w, i) => (
                <div key={i} style={{ fontSize: 8, color: "#8A6A1F", lineHeight: 1.6 }}>· {w}</div>
              ))}
            </div>
          )}

          {canCommit && (
            <div style={{ marginTop: 8, padding: "8px 11px", background: "rgba(31,185,76,.07)", border: "1px solid #1FB94C40", borderRadius: 4 }}>
              <div style={{ fontSize: 8, color: "#1FB94C", fontWeight: 700, letterSpacing: ".1em", marginBottom: 5 }}>✓ DIFF PREVIEW — {result.dataVersion}</div>
              <div style={{ fontSize: 8, color: "#5C5546", lineHeight: 1.8 }}>
                <div>Append week <b>{result.week.date}</b> {result.week.title ? `· "${result.week.title}"` : ""} → window {history.length} → {history.length + 1} wk (no wk1 drop)</div>
                <div>Macro: B&B {fmtNum(result.week.bb, 1)} · P/C {fmtNum(result.week.pcRatio, 2)} · SKEW {fmtNum(result.week.skew, 1)} · VIX {fmtNum(result.week.vix, 2)} · EM4wk {fmtNum(result.week.emOutflow4wk, 1)} · Cash {fmtNum(result.week.cashLevel, 1)} ({result.summary.nNullMacro} null)</div>
                <div>Flows: {result.summary.nFlows} sourced values · Hull: {result.summary.nHull} set{result.summary.nHull === 0 ? " (all default red — set via EDIT WEEK after commit)" : ""} · estFlags: {Object.keys(result.week.estFlags).length === 0 ? "{} (none — preferred)" : Object.keys(result.week.estFlags).join(", ")}</div>
                {Object.keys(result.week.srcNotes).length > 0 && (
                  <div style={{ color: "#8A7E68" }}>src: {Object.entries(result.week.srcNotes).map(([k, v]) => `${k}=${v}`).join(" · ")}</div>
                )}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function HartnettTrackerPutV2() {
  const [history, setHistory] = useState(null);
  const [dataVersion, setDataVersion] = useState("seed");
  const [activeWeek, setActiveWeek] = useState(10);
  const [activeGroup, setActiveGroup] = useState("Core Assets");
  const [editOpen, setEditOpen] = useState(false);
  const [storageOk, setStorageOk] = useState(null);
  const [saved, setSaved] = useState(false);
  const [tab, setTab] = useState("cards");
  const [showPutPanel, setShowPutPanel] = useState(false);

  useEffect(() => {
    (async () => {
      const stored = await loadHistory();
      if (stored && Array.isArray(stored.history) && stored.history.length >= 1) {
        setHistory(stored.history); setDataVersion(stored.dataVersion);
        setActiveWeek(stored.history.length - 1); setStorageOk(true);
      } else {
        setHistory(SEEDED_HISTORY); setDataVersion("seed");
        setActiveWeek(SEEDED_HISTORY.length - 1); setStorageOk(false);
      }
    })();
  }, []);

  const week = history ? history[activeWeek] : null;

  const updateWeek = useCallback((fn) => {
    setHistory(prev => prev.map((w, i) => i === activeWeek ? fn(w) : w));
    setSaved(false);
  }, [activeWeek]);

  const handleSave = async () => {
    if (!history) return;
    await saveHistory(history, dataVersion); setSaved(true); setStorageOk(true);
    setTimeout(() => setSaved(false), 2500);
  };

  const handleReset = async () => {
    await clearHistory();
    setHistory(SEEDED_HISTORY); setDataVersion("seed");
    setActiveWeek(SEEDED_HISTORY.length - 1); setStorageOk(false);
  };

  // Protocol v4 E.3: patch commit = append week + stamp DATA_VERSION + auto-save.
  const handlePatchCommit = async (newWeek, newDataVersion) => {
    const next = [...history, newWeek];
    setHistory(next); setDataVersion(newDataVersion);
    setActiveWeek(next.length - 1);
    await saveHistory(next, newDataVersion);
    setStorageOk(true); setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  const addWeek = () => {
    const last = history[history.length - 1];
    const d = new Date(last.date); d.setDate(d.getDate() + 7);
    const fresh = { ...last, date: d.toISOString().split("T")[0], title: "", flows: { ...last.flows }, hullSignals: { ...last.hullSignals } };
    setHistory(prev => [...prev, fresh]);
    setActiveWeek(history.length); setSaved(false);
  };

  if (!history || !week) return (
    <div style={{ minHeight: "100vh", background: "#FFFBF2", display: "flex", alignItems: "center", justifyContent: "center", color: "#6E6657", fontFamily: "'IBM Plex Mono',monospace", fontSize: 12 }}>LOADING…</div>
  );

    return { ...asset, iv, sig };

    .sort((a, b) => {
      const rank = { "BUY PUT ★": 0, "BUY PUT": 1, "SPREAD": 2, "PREP": 3 };
      return rank[a.iv.putVerdict] - rank[b.iv.putVerdict];

    <div style={{ minHeight: "100vh", background: "#FFFBF2", color: "#1A1A1A", ...mono, padding: "20px 18px" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
          <div>
            <div style={{ fontSize: 9, color: "#111111", letterSpacing: ".2em", marginBottom: 4 }}>HARTNETT TRACKER WITH PUT {TRACKER_VERSION} · IMPORT WEEK (PROTOCOL v4) · HULL SUITE · IV SOURCED/NULL · CREAM</div>
            <h1 style={{ margin: 0, fontSize: 20, fontWeight: 700, color: "#000000", letterSpacing: "-.02em" }}>Hartnett Tracker with Put {TRACKER_VERSION}</h1>
            <div style={{ fontSize: 8, color: "#8A7E68", marginTop: 3 }}>{history[0].date} – {history[lastIdx].date} · {history.length}-week history · 28 assets · weekly updates via IMPORT WEEK patch (no code regen) · momentum = Hull Suite · IV = Cboe indices (fresh) + ETF IV30 (⚠STALE excluded from Put Radar) · — = null</div>
          </div>

            <span style={{ fontSize: 7, color: "#8A7E68" }} title="stamped per accepted weekly patch">data {dataVersion}</span>
            <span style={{ fontSize: 8, color: storageOk ? "#1FB94C" : "#6E6657" }}>{storageOk ? "● SHARED" : "○ LOCAL (seed)"}</span>

<script>
(function () {
  function fail(label, e) {
    var b = document.getElementById("boot");
    if (b) b.remove();
    var box = document.getElementById("err");
    box.style.display = "block";
    box.textContent = label + "\n\n" + (e && e.stack ? e.stack : String(e));
  }
  try {
    if (!window.React || !window.ReactDOM) throw new Error("React UMD did not load (network/CDN blocked?)");
    if (!window.Babel) throw new Error("Babel standalone did not load (network/CDN blocked?)");

    // ⚠️ Append an EXPLICIT global handoff before transforming.
    // Indirect eval puts top-level declarations in the global LEXICAL scope,
    // which is not the same thing as a property of window. Verified locally:
    // inside the eval `typeof HartnettTrackerPutV2` is "function", outside it
    // is undefined on globalThis. Whether the bare name still resolves in the
    // enclosing script is engine-dependent — exactly the kind of default this
    // wrapper already got burned by once. So don't rely on it: hand the
    // component over by assignment, from inside the eval where the binding is
    // guaranteed visible.
    var src = document.getElementById("jsx-source").textContent
            + "\n;globalThis.__TRACKER_COMPONENT__ = HartnettTrackerPutV2;";

    // runtime:"classic" is the whole point — it emits React.createElement
    // against the UMD global instead of importing react/jsx-runtime.
    var out = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
      sourceType: "script"
    }).code;

    // Indirect eval keeps the transpiled declarations out of this closure but
    // still in global scope, so the component is reachable below.
    (0, eval)(out);

    var Component = globalThis.__TRACKER_COMPONENT__;
    if (typeof Component !== "function") {
      throw new Error("component handoff failed — __TRACKER_COMPONENT__ is " + typeof Component);
    }
    document.getElementById("boot").remove();
    ReactDOM.createRoot(document.getElementById("root"))
      .render(React.createElement(Component));
  } catch (e) {
    fail("LOAD FAILED", e);
  }
})();

// Anything that escapes the block above still surfaces rather than blanking.
window.addEventListener("error", function (ev) {
  var box = document.getElementById("err");
  if (box && box.style.display !== "block") {
    var b = document.getElementById("boot"); if (b) b.remove();
    box.style.display = "block";
    box.textContent = "RUNTIME ERROR\n\n" + (ev.message || "") + "\n" + (ev.filename || "");
  }
});
</script>
